aid: delve-bio
name: Delve Bio
description: 'Delve Bio is a genomic diagnostics company commercializing clinical metagenomic
  next-generation sequencing (mNGS) for infectious disease diagnosis. Its flagship test, Delve
  Detect, analyzes all nucleic acids in a single cerebrospinal fluid sample to simultaneously
  detect bacteria, viruses, fungi, and parasites, screening against a curated database of more
  than 68,000 pathogen species to diagnose meningitis and encephalitis with results in roughly
  48 hours. The company is the exclusive licensee of the University of California San Francisco
  (UCSF) mNGS technology developed at the Center for Next-Gen Precision Diagnostics, founded by
  Charles Chiu, Joe DeRisi, Michael Wilson, Pardis Sabeti, and Matthew Meyerson, and backed by
  investors including GV. Delve Bio operates as a CAP/CLIA-certified clinical laboratory serving
  labs and clinicians; it exposes no public developer API surface. Added to the API Evangelist
  network as a gv portfolio lead.'
